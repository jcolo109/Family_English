<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Perfil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BD3}a:hover{color:#1E3F9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F5F6FA; color: #161B33; font-family: 'Nunito Sans', system-ui, sans-serif">
<div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 40px 20px 16px; overflow: hidden">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px">Perfil</h1>
<div style="display: flex; align-items: center; gap: 16px">
<div style="position: relative; width: 76px; height: 76px; flex-shrink: 0">
<div aria-hidden="true" style="width: 76px; height: 76px; border-radius: 38px; background: #FFD9A8; color: #6B3A00; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px">J</div>
<button type="button" aria-label="Cambiar avatar" style="position: absolute; right: -4px; bottom: -4px; width: 36px; height: 36px; border-radius: 18px; border: 3px solid #F5F6FA; background: #161B33; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #5A6178">Nombre visible
<input type="text" value="Jose" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #D5DAE6; border-radius: 10px; font-family: inherit; font-size: 16px; font-weight: 700; color: #161B33; background: #FFFFFF">
</label>
<span style="font-size: 14px; color: #5A6178">jose@ejemplo.com</span>
</div>
</div>
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #5A6178">Notificaciones</h2>
<div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; overflow: hidden">
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #ECEEF4">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700">{{t.label}}</span>
<span style="font-size: 13px; color: #5A6178; line-height: 1.4">{{t.hint}}</span>
</div>
<button type="button" role="switch" aria-checked="{{t.checked}}" aria-label="{{t.label}}" onClick="{{t.toggle}}" style="{{t.track}}"><span aria-hidden="true" style="{{t.knob}}"></span></button>
</div>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #5A6178">Canal de aviso</h2>
<div style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #E6E9F2">
<button type="button" style="flex: 1; height: 44px; border: none; border-radius: 10px; background: #FFFFFF; color: #161B33; font-family: inherit; font-size: 15px; font-weight: 700; box-shadow: 0 1px 3px rgba(22,27,51,0.14)">Email</button>
<button type="button" disabled="disabled" style="flex: 1; height: 44px; border: none; border-radius: 10px; background: transparent; color: #5A6178; font-family: inherit; font-size: 15px; font-weight: 700">Push · pronto</button>
</div>
</section>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 14px; background: #FFFFFF; color: #161B33; font-weight: 800; font-size: 16px; text-decoration: none">Cerrar sesión</a>
<button type="button" style="height: 44px; border: none; background: none; font-family: inherit; font-size: 14px; font-weight: 700; color: #A3321F; cursor: pointer">Eliminar mi cuenta y mis datos</button>
</div>
</div>
<nav aria-label="Navegación principal" style="display: flex; padding: 6px 6px 18px; background: #FFFFFF; border-top: 1px solid #E3E6EE">
<a href="InicioGrupo.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
<a href="PalabrasDelDia.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="15" rx="2"></rect><path d="M8 3h11a2 2 0 0 1 2 2v12"></path></svg>Palabras</a>
<a href="Clasificacion.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-8h5v8M9.5 21V4h5v17M15 21v-5h5v5"></path></svg>Ranking</a>
<a href="Historial.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="m7 15 4-4 3 3 5-6"></path></svg>Historial</a>
<a href="Perfil.dc.html" aria-current="page" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 800"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BD3","options":["#2F5BD3","#0F7A6C","#6B3FC7","#B5402A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var accent = this.props.accent ?? '#2F5BD3';
var s = this.state || {};
var defs = [
{ id: 'morning', label: 'Palabras nuevas', hint: 'Aviso por la mañana con las 5 del día', def: true },
{ id: 'evening', label: 'Recordatorio de examen', hint: 'Por la tarde, si aún no lo has hecho', def: true },
{ id: 'mute', label: 'Silenciar Familia Colomar', hint: 'Sigues en el grupo, sin avisos', def: false }
];
return {
accent: accent,
toggles: defs.map(function (d) {
var on = s[d.id] === undefined ? d.def : s[d.id];
return {
label: d.label,
hint: d.hint,
checked: on ? 'true' : 'false',
track: 'position: relative; width: 52px; height: 32px; flex-shrink: 0; border: none; border-radius: 16px; cursor: pointer; background: ' + (on ? accent : '#C3C9D8'),
knob: 'position: absolute; top: 4px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2); left: ' + (on ? '24px' : '4px'),
toggle: function () { var u = {}; u[d.id] = !on; self.setState(u); }
};
})
};
}
}
</script>
</body>
</html>
