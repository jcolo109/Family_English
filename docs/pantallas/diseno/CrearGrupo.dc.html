<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear grupo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BD3}a:hover{color:#1E3F9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F5F6FA; color: #161B33; font-family: 'Nunito Sans', system-ui, sans-serif">
<header style="display: flex; align-items: center; gap: 8px; padding: 32px 12px 8px">
<a href="MisGrupos.dc.html" aria-label="Volver" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 24px; color: #161B33">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<span style="font-size: 14px; font-weight: 700; color: #5A6178">Paso 1 de 2</span>
</header>
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 0 20px 28px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px">Nuevo grupo</h1>
<p style="margin: 0; color: #5A6178; font-size: 15px; line-height: 1.5">Serás el organizador: mantienes la lista de palabras y también juegas.</p>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<button type="button" aria-label="Añadir imagen del grupo" style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 20px; border: 2px dashed #B9C1D6; background: #FFFFFF; color: #5A6178; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"></rect><circle cx="12" cy="12.5" r="3.5"></circle><path d="M8 5l1.5-2h5L16 5"></path></svg>
</button>
<div style="display: flex; flex-direction: column; gap: 2px; font-size: 14px">
<span style="font-weight: 800">Imagen del grupo</span>
<span style="color: #5A6178">Opcional</span>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Nombre del grupo
<input type="text" value="Familia Colomar" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 2px solid {{accent}}; border-radius: 12px; font-family: inherit; font-size: 16px; color: #161B33; background: #FFFFFF">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Descripción <span style="font-weight: 600; color: #5A6178">(opcional)</span>
<textarea rows="3" placeholder="Por ejemplo: vocabulario para el viaje a Londres" style="box-sizing: border-box; padding: 14px 16px; border: 1.5px solid #D5DAE6; border-radius: 12px; font-family: inherit; font-size: 16px; color: #161B33; background: #FFFFFF; resize: none"></textarea>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Zona horaria
<select style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #D5DAE6; border-radius: 12px; font-family: inherit; font-size: 16px; color: #161B33; background: #FFFFFF">
<option>Europa/Madrid (UTC+2)</option>
<option>Europa/Londres (UTC+1)</option>
<option>Atlántico/Canarias (UTC+1)</option>
</select>
</label>
<div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #E6EDFC; color: #1E2F66; font-size: 14px; line-height: 1.5">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E3F9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span>Cada día a las 00:00 de esta zona horaria se repartirán 5 palabras nuevas, las mismas para todo el grupo.</span>
</div>
<div style="flex: 1"></div>
<a href="Invitar.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none">Crear y seguir con invitaciones</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BD3","options":["#2F5BD3","#0F7A6C","#6B3FC7","#B5402A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2F5BD3' };
}
}
</script>
</body>
</html>
