<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Invitar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BD3}a:hover{color:#1E3F9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F5F6FA; color: #161B33; font-family: 'Nunito Sans', system-ui, sans-serif">
<header style="display: flex; align-items: center; gap: 8px; padding: 32px 12px 8px">
<a href="CrearGrupo.dc.html" aria-label="Volver" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 24px; color: #161B33">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<span style="font-size: 14px; font-weight: 700; color: #5A6178">Familia Colomar · Paso 2 de 2</span>
</header>
<div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 0 20px 28px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px">Invita a tu grupo</h1>
<p style="margin: 0; color: #5A6178; font-size: 15px; line-height: 1.5">Cada persona recibe un enlace de un solo uso que caduca en 7 días.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 2px solid {{accent}}">
<label for="emails" style="font-size: 14px; font-weight: 700">Emails</label>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 999px; background: #E6EDFC; color: #1E2F66; font-size: 14px; font-weight: 700">andres@ejemplo.com
<button type="button" aria-label="Quitar andres@ejemplo.com" style="width: 24px; height: 24px; border: none; border-radius: 12px; background: #CBD8F7; color: #1E2F66; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</span>
<input id="emails" type="email" placeholder="Escribe otro email…" style="flex: 1; min-width: 160px; height: 36px; border: none; font-family: inherit; font-size: 16px; color: #161B33; background: transparent; outline: none">
</div>
<button type="button" style="height: 48px; border: none; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Enviar invitaciones</button>
</div>
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #5A6178">Invitaciones enviadas</h2>
<span style="font-size: 13px; color: #5A6178">5 aceptadas de 7</span>
</div>
<div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; overflow: hidden">
<sc-for list="{{invites}}" as="inv" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #ECEEF4">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{inv.email}}</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5A6178"><span style="{{inv.badgeStyle}}">{{inv.status}}</span>{{inv.detail}}</span>
</div>
<sc-if value="{{inv.actions}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 2px">
<button type="button" aria-label="Reenviar invitación" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: #F0F2F8; color: #1E3F9E; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg></button>
<sc-if value="{{inv.cancel}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="Cancelar invitación" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: #FBEDEA; color: #A3321F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</sc-if>
</div>
</sc-if>
</div>
</sc-for>
</div>
<div style="flex: 1"></div>
<a href="InicioGrupo.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #161B33; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none">Ir al grupo</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BD3","options":["#2F5BD3","#0F7A6C","#6B3FC7","#B5402A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var b = 'padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 800; ';
var st = {
ok: b + 'background: #E3F4EA; color: #165C3A',
pend: b + 'background: #FFF1DC; color: #8A4200',
exp: b + 'background: #ECEEF4; color: #3D4460'
};
return {
accent: this.props.accent ?? '#2F5BD3',
invites: [
{ email: 'sofia@ejemplo.com', status: 'Pendiente', detail: 'caduca en 6 días', badgeStyle: st.pend, actions: true, cancel: true },
{ email: 'luis@ejemplo.com', status: 'Caducada', detail: 'el 2 oct', badgeStyle: st.exp, actions: true, cancel: false },
{ email: 'andres.r@ejemplo.com', status: 'Aceptada', detail: 'el 30 sep', badgeStyle: st.ok, actions: false, cancel: false },
{ email: 'pablo@ejemplo.com', status: 'Aceptada', detail: 'el 8 sep', badgeStyle: st.ok, actions: false, cancel: false },
{ email: 'marta@ejemplo.com', status: 'Aceptada', detail: 'el 7 sep', badgeStyle: st.ok, actions: false, cancel: false }
]
};
}
}
</script>
</body>
</html>
