<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vocabulario del grupo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BD3}a:hover{color:#1E3F9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F5F6FA; color: #161B33; font-family: 'Nunito Sans', system-ui, sans-serif">
<header style="display: flex; flex-direction: column; gap: 6px; padding: 30px 16px 0">
<div style="display: flex; align-items: center; gap: 4px">
<a href="InicioGrupo.dc.html" aria-label="Volver al grupo" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: #161B33; margin-left: -8px">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="display: flex; flex-direction: column">
<span style="font-size: 13px; font-weight: 700; color: #5A6178">Ajustes · Familia Colomar</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px">Vocabulario</h1>
</div>
</div>
<nav aria-label="Ajustes del grupo" style="display: flex; gap: 20px; border-bottom: 1px solid #E3E6EE; padding: 0 4px">
<a href="Vocabulario.dc.html" aria-current="page" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 800; color: #161B33; text-decoration: none; border-bottom: 3px solid {{accent}}">Vocabulario</a>
<a href="Miembros.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 700; color: #5A6178; text-decoration: none; border-bottom: 3px solid transparent">Miembros</a>
<a href="Invitar.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 700; color: #5A6178; text-decoration: none; border-bottom: 3px solid transparent">Invitaciones</a>
</nav>
</header>
<div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; overflow: hidden">
<div style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: #FFF4E5; border: 1.5px solid #FFD7A1; color: #4A3A20; font-size: 14px; line-height: 1.4">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A34A0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
<span><strong>Quedan 8 sin asignar:</strong> alcanzan para mañana y pasado. Añade más para no quedaros sin examen.</span>
</div>
<div style="display: flex; gap: 10px">
<button type="button" onClick="{{toggleForm}}" style="flex: 1; height: 48px; border: none; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Añadir palabra</button>
<button type="button" style="flex: 1; height: 48px; border: 1.5px solid #D5DAE6; border-radius: 14px; background: #FFFFFF; color: #161B33; font-family: inherit; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>Importar CSV</button>
</div>
<sc-if value="{{showForm}}" hint-placeholder-val="{{ false }}">
<form style="display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 2px solid {{accent}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">Inglés<input type="text" placeholder="to whisper" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #D5DAE6; border-radius: 10px; font-family: inherit; font-size: 16px; color: #161B33"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">Español<input type="text" placeholder="susurrar" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #D5DAE6; border-radius: 10px; font-family: inherit; font-size: 16px; color: #161B33"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">Ejemplo (opcional)<input type="text" placeholder="Don't whisper in class." style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #D5DAE6; border-radius: 10px; font-family: inherit; font-size: 16px; color: #161B33"></label>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{toggleForm}}" style="flex: 1; height: 44px; border: none; border-radius: 10px; background: #F0F2F8; color: #161B33; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Cancelar</button>
<button type="button" onClick="{{toggleForm}}" style="flex: 1; height: 44px; border: none; border-radius: 10px; background: #161B33; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Guardar</button>
</div>
</form>
</sc-if>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 4px 6px 4px 14px; border-bottom: 1px solid #ECEEF4">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 800">{{r.en}} <span style="font-weight: 600; color: #5A6178">· {{r.es}}</span></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5A6178"><span style="{{r.badge}}">{{r.state}}</span>{{r.meta}}</span>
</div>
<button type="button" aria-label="Editar {{r.en}}" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #3D4460; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BD3","options":["#2F5BD3","#0F7A6C","#6B3FC7","#B5402A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var accent = this.props.accent ?? '#2F5BD3';
var s = this.state || {};
var f = s.f || 'all';
var b = 'padding: 1px 7px; border-radius: 5px; font-weight: 800; ';
var badge = { pend: b + 'background: #E6EDFC; color: #1E3F9E', asg: b + 'background: #E3F4EA; color: #165C3A', arc: b + 'background: #ECEEF4; color: #3D4460' };
var all = [
['to whisper', 'susurrar', 'pend', 'Sin asignar', 'nº 176 · mañana'],
['cheap', 'barato', 'pend', 'Sin asignar', 'nº 177 · mañana'],
['to sneeze', 'estornudar', 'pend', 'Sin asignar', 'nº 178 · mañana'],
['brave', 'valiente', 'asg', 'Asignada', '12 oct · Adjetivos'],
['kettle', 'hervidor', 'asg', 'Asignada', '12 oct · Casa'],
['colour', 'color', 'arc', 'Archivada', 'duplicada']
];
var rows = all.filter(function (r) { return f === 'all' || r[2] === f; }).map(function (r) {
return { en: r[0], es: r[1], badge: badge[r[2]], state: r[3], meta: r[4] };
});
var chip = 'min-height: 36px; padding: 0 12px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; ';
var defs = [['all', 'Todas · 185'], ['pend', 'Sin asignar · 8'], ['asg', 'Asignadas · 175'], ['arc', 'Archivadas · 2']];
return {
accent: accent,
showForm: !!s.form,
toggleForm: function () { self.setState({ form: !s.form }); },
rows: rows,
filters: defs.map(function (d) {
var on = d[0] === f;
return {
label: d[1],
pressed: on ? 'true' : 'false',
style: chip + (on ? 'border: none; background: #161B33; color: #FFFFFF' : 'border: 1.5px solid #D5DAE6; background: #FFFFFF; color: #3D4460'),
pick: function () { self.setState({ f: d[0] }); }
};
})
};
}
}
</script>
</body>
</html>
