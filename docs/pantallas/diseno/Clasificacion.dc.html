<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clasificación</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BD3}a:hover{color:#1E3F9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F5F6FA; color: #161B33; font-family: 'Nunito Sans', system-ui, sans-serif">
<div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 36px 16px 12px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
<span style="font-size: 14px; font-weight: 700; color: #5A6178">Familia Colomar</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px">Clasificación</h1>
</div>
<div style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #E6E9F2">
<button type="button" aria-pressed="true" style="flex: 1; height: 40px; border: none; border-radius: 10px; background: #FFFFFF; color: #161B33; font-family: inherit; font-size: 14px; font-weight: 800; box-shadow: 0 1px 3px rgba(22,27,51,0.14)">Histórico</button>
<button type="button" disabled="disabled" style="flex: 1; height: 40px; border: none; border-radius: 10px; background: transparent; color: #5A6178; font-family: inherit; font-size: 14px; font-weight: 700">Semana · F2</button>
<button type="button" disabled="disabled" style="flex: 1; height: 40px; border: none; border-radius: 10px; background: transparent; color: #5A6178; font-family: inherit; font-size: 14px; font-weight: 700">Mes · F2</button>
</div>
<div style="display: flex; align-items: flex-end; gap: 8px; padding-top: 6px">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div aria-hidden="true" style="width: 52px; height: 52px; border-radius: 26px; background: #FFD9A8; color: #6B3A00; border: 3px solid {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">J</div>
<span style="font-size: 14px; font-weight: 800">Jose (tú)</span>
<div style="align-self: stretch; height: 84px; border-radius: 14px 14px 0 0; background: #DDE2EC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; color: #2A3045">2</span>
<span style="font-size: 13px; font-weight: 700; color: #2A3045">274 pts</span>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg aria-hidden="true" width="26" height="20" viewBox="0 0 26 20" fill="#F5C542" stroke="#A97F06" stroke-width="1.5" stroke-linejoin="round"><path d="M2 6l6 5 5-9 5 9 6-5-2 12H4z"></path></svg>
<div aria-hidden="true" style="width: 60px; height: 60px; border-radius: 30px; background: #CDEBE3; color: #0B4F45; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px">L</div>
<span style="font-size: 14px; font-weight: 800">Lucía</span>
<div style="align-self: stretch; height: 116px; border-radius: 14px 14px 0 0; background: #F5C542; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; color: #4D3900">1</span>
<span style="font-size: 13px; font-weight: 800; color: #4D3900">281 pts</span>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div aria-hidden="true" style="width: 52px; height: 52px; border-radius: 26px; background: #E5DAF7; color: #3E2275; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">M</div>
<span style="font-size: 14px; font-weight: 800">Marta</span>
<div style="align-self: stretch; height: 64px; border-radius: 14px 14px 0 0; background: #EBC3A5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; color: #4A2408">3</span>
<span style="font-size: 13px; font-weight: 700; color: #4A2408">259 pts</span>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; overflow: hidden; margin-top: -14px">
<div style="display: flex; gap: 10px; padding: 10px 14px; font-size: 12px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; color: #5A6178; border-bottom: 1px solid #ECEEF4">
<span style="width: 26px">#</span><span style="flex: 1">Jugador</span><span style="width: 62px; text-align: right">Exámenes</span><span style="width: 52px; text-align: right">Puntos</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="{{r.rowStyle}}">
<span style="width: 26px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">{{r.pos}}</span>
<span style="flex: 1; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700">{{r.name}}<span aria-label="{{r.trendLabel}}" style="{{r.trendStyle}}">{{r.trend}}</span></span>
<span style="width: 62px; text-align: right; font-size: 14px; color: #5A6178">{{r.exams}}</span>
<span style="width: 52px; text-align: right; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">{{r.pts}}</span>
</div>
</sc-for>
</div>
<p style="margin: 0; padding: 0 4px; font-size: 12px; line-height: 1.5; color: #5A6178">Empates: gana quien ha hecho más exámenes y, después, quien lleva más tiempo en el grupo.</p>
</div>
<nav aria-label="Navegación principal" style="display: flex; padding: 6px 6px 18px; background: #FFFFFF; border-top: 1px solid #E3E6EE">
<a href="InicioGrupo.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
<a href="PalabrasDelDia.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="15" rx="2"></rect><path d="M8 3h11a2 2 0 0 1 2 2v12"></path></svg>Palabras</a>
<a href="Clasificacion.dc.html" aria-current="page" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 800"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-8h5v8M9.5 21V4h5v17M15 21v-5h5v5"></path></svg>Ranking</a>
<a href="Historial.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="m7 15 4-4 3 3 5-6"></path></svg>Historial</a>
<a href="Perfil.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BD3","options":["#2F5BD3","#0F7A6C","#6B3FC7","#B5402A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var row = 'display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border-bottom: 1px solid #ECEEF4; ';
var t = 'font-size: 12px; font-weight: 800; ';
var up = t + 'color: #165C3A', down = t + 'color: #A3321F', eq = t + 'color: #5A6178';
var data = [
['1', 'Lucía', '35', '281', '=', 'Sin cambios', eq, false],
['2', 'Jose (tú)', '34', '274', '=', 'Sin cambios', eq, true],
['3', 'Marta', '34', '259', '▲1', 'Sube 1 puesto', up, false],
['4', 'Pablo', '32', '240', '▼1', 'Baja 1 puesto', down, false],
['5', 'Carmen', '29', '198', '=', 'Sin cambios', eq, false],
['6', 'Andrés', '11', '86', '=', 'Sin cambios', eq, false]
];
return {
accent: this.props.accent ?? '#2F5BD3',
rows: data.map(function (d) {
return { pos: d[0], name: d[1], exams: d[2], pts: d[3], trend: d[4], trendLabel: d[5], trendStyle: d[6], rowStyle: row + (d[7] ? 'background: #EEF2FD' : '') };
})
};
}
}
</script>
</body>
</html>
