<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Repaso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BD3}a:hover{color:#1E3F9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F5F6FA; color: #161B33; font-family: 'Nunito Sans', system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 36px 16px 10px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px">Repaso</h1>
<a href="PalabrasDelDia.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 800; text-decoration: none; color: {{accent}}">Palabras de hoy</a>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #D5DAE6">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6178" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar palabra</span>
<input type="search" placeholder="Buscar en inglés o español" value="{{query}}" onChange="{{onQuery}}" style="flex: 1; height: 44px; border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; color: #161B33">
</label>
<div style="display: flex; gap: 8px">
<button type="button" aria-pressed="{{allPressed}}" onClick="{{showAll}}" style="{{allStyle}}">Todas · 175</button>
<button type="button" aria-pressed="{{failPressed}}" onClick="{{showFailed}}" style="{{failStyle}}">Falladas · 9</button>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 16px 12px; overflow: hidden">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #5A6178">{{g.date}}</h2>
<div style="display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; overflow: hidden">
<sc-for list="{{g.words}}" as="w" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 14px; border-bottom: 1px solid #ECEEF4">
<div style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 16px; font-weight: 800">{{w.en}}</span>
<span style="font-size: 14px; color: #5A6178">{{w.es}}</span>
</div>
<sc-if value="{{w.failed}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; background: #FBEDEA; color: #A3321F; font-size: 12px; font-weight: 800">{{w.failLabel}}</span>
</sc-if>
</div>
</sc-for>
</div>
</section>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 24px; text-align: center; color: #5A6178; font-size: 15px">Ninguna palabra coincide con la búsqueda.</p>
</sc-if>
</div>
<nav aria-label="Navegación principal" style="display: flex; padding: 6px 6px 18px; background: #FFFFFF; border-top: 1px solid #E3E6EE">
<a href="InicioGrupo.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
<a href="PalabrasDelDia.dc.html" aria-current="page" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 800"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="15" rx="2"></rect><path d="M8 3h11a2 2 0 0 1 2 2v12"></path></svg>Palabras</a>
<a href="Clasificacion.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-8h5v8M9.5 21V4h5v17M15 21v-5h5v5"></path></svg>Ranking</a>
<a href="Historial.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="m7 15 4-4 3 3 5-6"></path></svg>Historial</a>
<a href="Perfil.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5A6178; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BD3","options":["#2F5BD3","#0F7A6C","#6B3FC7","#B5402A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var accent = this.props.accent ?? '#2F5BD3';
var s = this.state || {};
var q = (s.q || '').toLowerCase();
var onlyFailed = !!s.failed;
var data = [
{ date: 'Hoy · 12 oct', words: [['brave', 'valiente', 0], ['to borrow', 'tomar prestado', 1], ['kettle', 'hervidor', 0], ['neighbour', 'vecino', 0], ['although', 'aunque', 0]] },
{ date: 'Ayer · 11 oct', words: [['to lend', 'prestar', 0], ['besides', 'además', 1], ['spoon', 'cuchara', 0], ['window', 'ventana', 0], ['tired', 'cansado', 0]] },
{ date: '10 oct', words: [['to wonder', 'preguntarse', 2], ['cupboard', 'armario', 2], ['early', 'temprano', 0], ['sink', 'fregadero', 0], ['loud', 'ruidoso', 0]] }
];
var groups = data.map(function (g) {
return {
date: g.date,
words: g.words.filter(function (w) {
var hit = !q || w[0].toLowerCase().indexOf(q) >= 0 || w[1].toLowerCase().indexOf(q) >= 0;
return hit && (!onlyFailed || w[2] > 0);
}).map(function (w) {
return { en: w[0], es: w[1], failed: w[2] > 0, failLabel: w[2] === 1 ? 'Fallada 1 vez' : 'Fallada ' + w[2] + ' veces' };
})
};
}).filter(function (g) { return g.words.length > 0; });
var chip = 'min-height: 40px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; ';
var on = chip + 'border: none; background: #161B33; color: #FFFFFF';
var off = chip + 'border: 1.5px solid #D5DAE6; background: #FFFFFF; color: #3D4460';
return {
accent: accent,
query: s.q || '',
groups: groups,
empty: groups.length === 0,
allStyle: onlyFailed ? off : on,
failStyle: onlyFailed ? on : off,
allPressed: onlyFailed ? 'false' : 'true',
failPressed: onlyFailed ? 'true' : 'false',
onQuery: function (e) { self.setState({ q: e.target.value }); },
showAll: function () { self.setState({ failed: false }); },
showFailed: function () { self.setState({ failed: true }); }
};
}
}
</script>
</body>
</html>
