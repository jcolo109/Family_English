<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Examen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BD3}a:hover{color:#1E3F9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F5F6FA; color: #161B33; font-family: 'Nunito Sans', system-ui, sans-serif">
<header style="display: flex; flex-direction: column; gap: 10px; padding: 32px 20px 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 800">Pregunta {{num}} de 10</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #5A6178"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Un solo intento</span>
</div>
<div role="progressbar" aria-label="Progreso del examen" aria-valuemin="0" aria-valuemax="10" aria-valuenow="{{num}}" style="height: 10px; border-radius: 5px; background: #E3E6EE; overflow: hidden">
<div style="{{barStyle}}"></div>
</div>
</header>
<div style="flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 18px 20px 28px">
<span style="align-self: flex-start; padding: 5px 12px; border-radius: 999px; background: #E6EDFC; color: #1E3F9E; font-size: 13px; font-weight: 800">{{q.dir}}</span>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 6px 0 10px">
<span style="font-size: 15px; font-weight: 700; color: #5A6178">¿Cómo se dice…?</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 1.05">{{q.term}}</h1>
</div>
<div role="radiogroup" aria-label="Opciones" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="{{o.style}}">
<span aria-hidden="true" style="{{o.badge}}">{{o.letter}}</span>
<span style="flex: 1; text-align: left">{{o.text}}</span>
</button>
</sc-for>
</div>
<div style="flex: 1"></div>
<sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{next}}" disabled="{{disabled}}" style="{{ctaStyle}}">Siguiente</button>
</sc-if>
<sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
<a href="Resultado.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-weight: 800; font-size: 17px; text-decoration: none">Terminar y ver resultado</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BD3","options":["#2F5BD3","#0F7A6C","#6B3FC7","#B5402A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var accent = this.props.accent ?? '#2F5BD3';
var s = this.state || {};
var qs = [
{ dir: 'Inglés → Español', term: 'kettle', opts: ['vecino', 'hervidor', 'cuchara', 'armario'] },
{ dir: 'Español → Inglés', term: 'aunque', opts: ['besides', 'early', 'although', 'tired'] },
{ dir: 'Inglés → Español', term: 'to borrow', opts: ['prestar', 'preguntarse', 'cansado', 'tomar prestado'] }
];
var k = s.k || 0;
var q = qs[k];
var sel = s.sel === undefined ? null : s.sel;
var letters = ['A', 'B', 'C', 'D'];
var last = k === qs.length - 1;
return {
accent: accent,
q: q,
num: 8 + k,
barStyle: 'height: 100%; border-radius: 5px; background: ' + accent + '; width: ' + ((7 + k + (sel !== null ? 1 : 0)) * 10) + '%',
opts: q.opts.map(function (t, j) {
var on = sel === j;
return {
text: t,
letter: letters[j],
checked: on ? 'true' : 'false',
style: 'display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 16px; border-radius: 16px; font-family: inherit; font-size: 18px; font-weight: 700; color: #161B33; cursor: pointer; ' + (on ? 'border: 2px solid ' + accent + '; background: #EEF2FD' : 'border: 2px solid #E3E6EE; background: #FFFFFF'),
badge: 'width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; ' + (on ? 'background: ' + accent + '; color: #FFFFFF' : 'background: #F0F2F8; color: #3D4460'),
pick: function () { self.setState({ sel: j }); }
};
}),
notLast: !last || sel === null,
isLast: last && sel !== null,
disabled: sel === null,
ctaStyle: 'height: 56px; border: none; border-radius: 16px; font-family: inherit; font-weight: 800; font-size: 17px; ' + (sel === null ? 'background: #DDE1EA; color: #5A6178; cursor: default' : 'background: ' + accent + '; color: #FFFFFF; cursor: pointer'),
next: function () { if (sel !== null && !last) { self.setState({ k: k + 1, sel: undefined }); } }
};
}
}
</script>
</body>
</html>
